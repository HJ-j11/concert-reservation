spring:
  profiles:
    active: local
  jpa:
    hibernate:
      ddl-auto: update # options: none, validate, update, create, create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
    show-sql: true
logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace # 바인딩 파라미터 값 출력